# This workflow will pass tests of module passed by input

name: ERP_REUSABLE
on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string
      pyversion:
        required: false
        type: string
        default: '["2.7"]'
      erpbranch:
        required: false
        type: string
        default: rolling_erp01
      all_modules:
        required: false
        type: string
        default: "false"
      upload_coverage:
        required: false
        type: boolean
        default: false
    secrets:
      ACCESS_TOKEN_GA:
        required: true
      ESIOS_TOKEN:
        required: true
      SRID:
        required: true
      CODECOV_TOKEN:
        required: true
      MOTOSERRA_URL:
        required: false
      MOTOSERRA_TOKEN:
        required: false

env:
  POSTGRES_USER: erp
  POSTGRES_PASSWORD: erp
  PYENV_ROOT: /home/runner/.pyenv
  ROOT_DIR_SRC: ${{github.workspace}}/..

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      # You can use PyPy versions in python-version.
      # For example, pypy2 and pypy3
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.pyversion) }}
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432
      redis:
        image: redis:5.0
        ports:
          # Maps tcp port 6379 on service container to the host
          - 6379:6379
      mongo:
        image: mongo:3.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Install pyenv
        run: |
          curl https://pyenv.run | bash
          echo "$PYENV_ROOT/bin" >> $GITHUB_PATH
          echo "$PYENV_ROOT/shims" >> $GITHUB_PATH

      - name: Install Python ${{ matrix.python-version }}
        run: |
          pyenv install ${{ matrix.python-version }}
          pyenv global ${{ matrix.python-version }}
          pip install --upgrade pip setuptools wheel

      - name: Checkout openerp_som_addons bootstrap scripts
        uses: actions/checkout@v6.0.2
        with:
          repository: Som-Energia/openerp_som_addons
          ref: main
          token: ${{ secrets.ACCESS_TOKEN_GA }}
          path: .ci/openerp_som_addons

      - name: Bootstrap ERP environment
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN_GA }}
          ERP_BRANCH: ${{ inputs.erpbranch }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: .ci/openerp_som_addons/scripts/bootstrap-erp-env.sh

      - name: Rebuild addon links from the PR checkout
        run: |
          rm -rf .ci/openerp_som_addons
          (cd ../erp && ./tools/link_addons.sh)

      - name: Run Tests
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN_GA }}
          ESIOS_TOKEN: ${{ secrets.ESIOS_TOKEN }}
          SRID: ${{ secrets.SRID }}
        run: |
          export CI_REPO=som-energia/openerp_som_addons
          export CI_PULL_REQUEST=${{ github.event.number }}
          export PYTHONPATH=${{github.workspace}}/../erp/server/bin:${{github.workspace}}/../erp/server/bin/addons:${{github.workspace}}/../erp/server/sitecustomize
          export OPENERP_PRICE_ACCURACY=6
          export OORQ_ASYNC=False
          export OPENERP_SRID=$SRID
          export OPENERP_ESIOS_TOKEN=$ESIOS_TOKEN
          export OPENERP_MONGODB_HOST=localhost
          export OPENERP_REDIS_URL=redis://localhost:6379/0
          export OPENERP_ROOT_PATH=${{github.workspace}}/../erp/server/bin
          export OPENERP_ADDONS_PATH=$OPENERP_ROOT_PATH/addons
          export OPENERP_DB_HOST=localhost
          export OPENERP_DB_USER=$POSTGRES_USER
          export OPENERP_DB_PASSWORD=$POSTGRES_PASSWORD
          export OPENERP_SII_TEST_MODE=1
          export OPENERP_SECRET="verysecret"
          export OPENERP_IGNORE_PUBSUB=1
          cd ${{github.workspace}}
          export GIT_TERMINAL_PROMPT=0

          git config --global --get-regexp '^url\..*\.insteadof$' || true
          git config --global --show-origin --get-regexp '^url\..*\.insteadof$' || true
          test -n "${GITHUB_TOKEN:-}" && echo "GITHUB_TOKEN is set" || echo "GITHUB_TOKEN is missing"

          git config --global \
            url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf \
            "ssh://git@github.com/"

          if [ "${{ inputs.all_modules }}" = "true" ]; then
            destral --report-coverage --enable-coverage --report-junitxml ${{github.workspace}}/test-results/destral -m ${{ inputs.module }} --no-dropdb
          else
            destral --report-coverage --enable-coverage --report-junitxml ${{github.workspace}}/test-results/destral -m ${{ inputs.module }}
          fi

      - name: Upload module database to Motoserra
        if: ${{ always() && inputs.all_modules == 'true' }}
        env:
          MOTOSERRA_URL: ${{ secrets.MOTOSERRA_URL }}
          MOTOSERRA_TOKEN: ${{ secrets.MOTOSERRA_TOKEN }}
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$POSTGRES_CONTAINER"

          test_db="$(docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" "$POSTGRES_CONTAINER" psql -U "$POSTGRES_USER" -d postgres -Atc "SELECT datname FROM pg_database WHERE datname LIKE 'test\\_%' ESCAPE '\\' ORDER BY oid DESC LIMIT 1")"
          test -n "$test_db"
          case "$test_db" in
            test_*) ;;
            *) exit 1 ;;
          esac

          printf '%s' "$test_db" > "$RUNNER_TEMP/motoserra-test-db"
          test -n "$MOTOSERRA_URL"
          test -n "$MOTOSERRA_TOKEN"
          dump_file="$RUNNER_TEMP/${{ inputs.module }}.dump"
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" "$POSTGRES_CONTAINER" pg_dump -U "$POSTGRES_USER" --format=custom --no-owner "$test_db" > "$dump_file"
          base64 --wrap=0 "$dump_file" > "${dump_file}.base64"
          jq -n --arg module "${{ inputs.module }}" --rawfile db "${dump_file}.base64" \
            '{module_name: $module, db: $db}' | \
            curl --fail --show-error --silent --retry 3 --retry-all-errors \
              --connect-timeout 15 --max-time 900 \
              -X POST "$MOTOSERRA_URL/databases" \
              -H "Authorization: Bearer $MOTOSERRA_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @-

      - name: Drop preserved test database
        if: ${{ always() && inputs.all_modules == 'true' }}
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/motoserra-test-db" || exit 0
          test_db="$(cat "$RUNNER_TEMP/motoserra-test-db")"
          case "$test_db" in
            test_*) ;;
            *) exit 1 ;;
          esac
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" "$POSTGRES_CONTAINER" dropdb -U "$POSTGRES_USER" --if-exists "$test_db"

      - name: Publish Unit Test Results
        if: (success() || failure()) && matrix.python-version == '2.7'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/destral/*.xml
          secondary_rate_limit_wait_seconds: 120.0

      - name: Generate coverage file
        run: |
          cd ${{github.workspace}}
          coverage xml

      - name: Upload coverage reports to Codecov of a module
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ inputs.module }}
        if: ${{ inputs.all_modules == 'false' }}

      - name: Upload coverage reports to Codecov all modules
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: ${{ inputs.all_modules == 'true' }}

      - name: Upload coverage.xml artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: coverage.xml
          path: coverage.xml
        if: ${{ inputs.upload_coverage }}
